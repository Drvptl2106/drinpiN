<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>drinpiN</title>
  <meta name="description" content="Save outfit and reel links, tag each piece, find where to buy it, and never lose a saved reel again.">
  <meta name="theme-color" content="#9d3c5d">

  <!-- Makes the app installable on phones -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="drinpiN">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Top bar: logo and search -->
  <header id="topbar" class="topbar">
    <a class="brand" href="#/outfits" aria-label="drinpiN home">
      <img src="icons/icon.svg" alt="" width="30" height="30">
      <span class="wordmark">drinpi<span>N</span></span>
    </a>
    <div id="search-bar" class="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search titles, notes, pieces…" aria-label="Search saved items" autocomplete="off" enterkeyhint="search">
    </div>
  </header>

  <!-- Every screen is drawn in here by app.js -->
  <main id="view" class="view"></main>

  <!-- Floating "+ Add" button -->
  <button id="add-button" class="fab" type="button" aria-label="Add a link">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add</span>
  </button>

  <!-- Bottom tab bar, like a phone app -->
  <nav id="tabs" class="bottom-nav" aria-label="Sections">
    <a href="#/outfits" data-tab="outfits">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6.5a2 2 0 1 1 2 2V10"/><path d="M12 10 3 16.5h18Z"/></svg>
      <span>Outfits</span>
    </a>
    <a href="#/reels" data-tab="reels">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M10 9v6l5-3Z"/></svg>
      <span>Reels</span>
      <b id="reel-badge" class="nav-badge" hidden></b>
    </a>
    <a href="#/wardrobe" data-tab="wardrobe">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M12 3v18M9.5 11v2M14.5 11v2"/></svg>
      <span>Wardrobe</span>
    </a>
    <a href="#/more" data-tab="more">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <span>More</span>
    </a>
  </nav>

  <!-- Small pop-up messages ("Saved", "Deleted · Undo", ...) -->
  <div id="toast" class="toast" role="status" aria-live="polite">
    <span id="toast-text"></span>
    <button id="toast-action" type="button" hidden></button>
  </div>

  <!-- Order matters: the shop list and storage must load before the app -->
  <script src="stores.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
