# Optional: publishes the link-preview function to Supabase whenever it changes.
# Needs a SUPABASE_ACCESS_TOKEN secret and a SUPABASE_PROJECT_REF variable (see SETUP.md).
# If you'd rather paste the function into the Supabase dashboard by hand, you can ignore this.
name: Deploy link-preview function

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - if: env.SUPABASE_ACCESS_TOKEN != '' && env.PROJECT_REF != ''
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: env.SUPABASE_ACCESS_TOKEN != '' && env.PROJECT_REF != ''
        run: supabase functions deploy link-preview --project-ref "$PROJECT_REF"
      - if: env.SUPABASE_ACCESS_TOKEN == '' || env.PROJECT_REF == ''
        run: echo "Skipped - add SUPABASE_ACCESS_TOKEN (secret) and SUPABASE_PROJECT_REF (variable) to enable."
